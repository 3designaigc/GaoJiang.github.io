<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="高將精機深色 SCADA 玻璃風格入口，進入 FAMM 與 FM-350 Web3D 系統。">
    <title>高將精機 | SCADA Glass Gate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050913;
            --bg-2: #0b1324;
            --glass: rgba(12, 20, 36, 0.66);
            --glass-strong: rgba(17, 29, 50, 0.78);
            --line: rgba(148, 189, 236, 0.2);
            --line-strong: rgba(160, 210, 255, 0.42);
            --text: #edf6ff;
            --muted: #8ca8c6;
            --cyan: #72d7ff;
            --blue: #3f8cff;
            --green: #5dffb0;
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: var(--bg);
        }

        body {
            min-height: 100vh;
            margin: 0;
            color: var(--text);
            font-family: "Oswald", "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
            letter-spacing: 0;
            background:
                radial-gradient(circle at 18% 14%, rgba(63, 140, 255, 0.18), transparent 32%),
                radial-gradient(circle at 86% 72%, rgba(114, 215, 255, 0.12), transparent 30%),
                linear-gradient(135deg, var(--bg) 0%, var(--bg-2) 100%);
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                linear-gradient(90deg, transparent 47px, rgba(114, 215, 255, 0.045) 48px, transparent 49px),
                linear-gradient(0deg, transparent 47px, rgba(114, 215, 255, 0.04) 48px, transparent 49px);
            background-size: 96px 96px;
            pointer-events: none;
        }

        .shell {
            position: relative;
            z-index: 1;
            width: min(100%, 1180px);
            min-height: 100vh;
            margin: 0 auto;
            padding: clamp(22px, 4vw, 36px);
            display: grid;
            grid-template-rows: auto 1fr auto;
            gap: clamp(26px, 5vw, 42px);
        }

        .topbar {
            min-height: 74px;
            padding: 18px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 22px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.025));
            border: 1px solid var(--line);
            box-shadow: 0 24px 58px rgba(0, 0, 0, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(18px) saturate(1.4);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .brand-mark {
            width: 32px;
            height: 32px;
            border: 1px solid var(--line-strong);
            position: relative;
            transform: rotate(45deg);
            box-shadow: 0 0 28px rgba(114, 215, 255, 0.16);
        }

        .brand-mark::before,
        .brand-mark::after {
            content: "";
            position: absolute;
            inset: 7px;
            border: 1px solid rgba(114, 215, 255, 0.32);
        }

        .brand-mark::after {
            inset: 13px;
            background: var(--cyan);
            border: 0;
            box-shadow: 0 0 18px rgba(114, 215, 255, 0.82);
        }

        .brand-text {
            min-width: 0;
        }

        .brand-text h1 {
            margin: 0;
            font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            font-size: clamp(1.32rem, 2.6vw, 1.85rem);
            font-weight: 400;
            letter-spacing: 0.08em;
            line-height: 1.15;
        }

        .brand-text p {
            margin: 5px 0 0;
            color: var(--muted);
            font-size: 0.78rem;
            font-weight: 300;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .status-strip {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 18px;
            color: var(--muted);
            font-size: 0.78rem;
            font-weight: 300;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: var(--green);
            box-shadow: 0 0 16px rgba(93, 255, 176, 0.9);
        }

        .gate-panel {
            position: relative;
            align-self: center;
            padding: clamp(26px, 5vw, 46px);
            background: linear-gradient(135deg, var(--glass-strong), var(--glass));
            border: 1px solid var(--line);
            box-shadow: 0 34px 86px rgba(0, 0, 0, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(22px) saturate(1.45);
            overflow: hidden;
        }

        .gate-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(120deg, rgba(255, 255, 255, 0.1), transparent 28%),
                linear-gradient(0deg, transparent, rgba(114, 215, 255, 0.04));
            pointer-events: none;
        }

        .panel-head {
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: clamp(26px, 4vw, 38px);
        }

        .panel-title {
            margin: 0;
            font-size: clamp(1.45rem, 3vw, 2.2rem);
            font-weight: 500;
            line-height: 1;
            text-transform: uppercase;
        }

        .panel-kicker {
            color: var(--cyan);
            font-size: 0.78rem;
            font-weight: 300;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .gate-grid {
            position: relative;
            display: grid;
            grid-template-columns: repeat(2, minmax(220px, 1fr));
            gap: clamp(24px, 4vw, 34px);
        }

        .system-card {
            position: relative;
            min-width: 0;
            padding: 14px;
            color: inherit;
            text-decoration: none;
            background: rgba(2, 7, 17, 0.42);
            border: 1px solid rgba(160, 210, 255, 0.18);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transition: transform 180ms ease, border-color 180ms ease, background 180ms ease, box-shadow 180ms ease;
            outline: none;
        }

        .system-card:hover,
        .system-card:focus-visible {
            transform: translateY(-5px);
            border-color: rgba(114, 215, 255, 0.62);
            background: rgba(7, 17, 33, 0.76);
            box-shadow: 0 22px 42px rgba(0, 0, 0, 0.35), 0 0 32px rgba(63, 140, 255, 0.14);
        }

        .system-card::before,
        .system-card::after {
            content: "";
            position: absolute;
            width: 28px;
            height: 28px;
            border-color: var(--line-strong);
            pointer-events: none;
        }

        .system-card::before {
            top: 8px;
            left: 8px;
            border-top: 1px solid;
            border-left: 1px solid;
        }

        .system-card::after {
            right: 8px;
            bottom: 8px;
            border-right: 1px solid;
            border-bottom: 1px solid;
        }

        .image-frame {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            margin: 0;
            background: #050814;
            overflow: hidden;
        }

        .image-frame img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            transition: transform 260ms ease, filter 260ms ease;
        }

        .system-card:hover img,
        .system-card:focus-visible img {
            transform: scale(1.028);
            filter: brightness(1.08) contrast(1.05);
        }

        .image-frame::after {
            content: "";
            position: absolute;
            inset: 0;
            border: 1px solid rgba(255, 255, 255, 0.05);
            background: linear-gradient(180deg, rgba(114, 215, 255, 0.05), rgba(0, 0, 0, 0.1));
            pointer-events: none;
        }

        .system-label {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 1;
            color: #bddbff;
            font-size: clamp(3rem, 6vw, 3.45rem);
            font-weight: 500;
            line-height: 1;
            text-transform: uppercase;
            text-shadow: 0 1px 12px rgba(0, 0, 0, 0.6);
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            margin-top: 14px;
            color: var(--text);
            font-size: clamp(0.98rem, 1.8vw, 1.13rem);
            font-weight: 500;
            line-height: 1;
            text-transform: uppercase;
        }

        .card-footer span:last-child {
            color: var(--cyan);
            opacity: 0.78;
            transition: transform 180ms ease, opacity 180ms ease;
        }

        .system-card:hover .card-footer span:last-child,
        .system-card:focus-visible .card-footer span:last-child {
            transform: translateX(4px);
            opacity: 1;
        }

        .bottomline {
            display: flex;
            justify-content: space-between;
            gap: 24px;
            color: rgba(237, 246, 255, 0.42);
            font-size: 0.72rem;
            font-weight: 300;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        @media (max-width: 760px) {
            .shell {
                padding: 18px;
            }

            .topbar,
            .panel-head,
            .bottomline {
                flex-direction: column;
                align-items: flex-start;
            }

            .status-strip {
                flex-wrap: wrap;
                justify-content: flex-start;
                white-space: normal;
            }

            .gate-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main class="shell" aria-label="高將精機 SCADA 玻璃系統入口">
        <header class="topbar">
            <div class="brand">
                <div class="brand-mark" aria-hidden="true"></div>
                <div class="brand-text">
                    <h1>高將精機</h1>
                    <p>Digital Twin Entry Console</p>
                </div>
            </div>
            <div class="status-strip">
                <span class="live-dot" aria-hidden="true"></span>
                <span>Telemetry Online</span>
                <span>AVO Active</span>
            </div>
        </header>

        <section class="gate-panel" aria-label="Web3D system gates">
            <div class="panel-head">
                <h2 class="panel-title">System Gate</h2>
                <div class="panel-kicker">SCADA Glass Interface / 2601GJ</div>
            </div>

            <div class="gate-grid">
                <a class="system-card" href="./FAMM/GaoJiang_Explorer_Premium.html" aria-label="進入 FAMM 系統">
                    <figure class="image-frame">
                        <img src="./img/FAMM.jpg" alt="FAMM 3D assembly model">
                        <figcaption class="system-label">FAMM</figcaption>
                    </figure>
                    <div class="card-footer">
                        <span>ENTER SYSTEM GATE</span>
                        <span aria-hidden="true">→</span>
                    </div>
                </a>

                <a class="system-card" href="./GH/GH_Explorer_Premium.html" aria-label="進入 FM-350 系統">
                    <figure class="image-frame">
                        <img src="./img/FM-350.jpg" alt="FM-350 3D machine model">
                        <figcaption class="system-label">FM-350</figcaption>
                    </figure>
                    <div class="card-footer">
                        <span>ENTER SYSTEM GATE</span>
                        <span aria-hidden="true">→</span>
                    </div>
                </a>
            </div>
        </section>

        <footer class="bottomline">
            <span>GJWEB_ARES / SCADA GLASS GATE</span>
            <span>LOCAL FILE READY / POSTMESSAGE SYSTEM</span>
        </footer>
    </main>
</body>
</html>
